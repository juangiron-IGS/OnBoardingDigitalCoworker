name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coworker
          POSTGRES_PASSWORD: ci-admin-password   # throwaway value for the CI container only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PORT: "5432"
      DB_NAME: coworker
      DB_ADMIN_PASSWORD: ci-admin-password
      DB_APP_PASSWORD: ci-app-password
      DB_AUDIT_PASSWORD: ci-audit-password
      DATABASE_URL: postgresql://coworker_app:ci-app-password@127.0.0.1:5432/coworker
      AUDIT_DATABASE_URL: postgresql://audit_writer:ci-audit-password@127.0.0.1:5432/coworker
      MODEL_PROVIDER: rules
      JOBDIVA_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Database (application and test databases)
        run: |
          export PGPASSWORD="$DB_ADMIN_PASSWORD"
          bash scripts/apply_db.sh
          createdb -h 127.0.0.1 -U postgres "${DB_NAME}_test"
          DB_NAME="${DB_NAME}_test" bash scripts/apply_db.sh

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q --cov=. --cov-report=term --cov-fail-under=70
