<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onboarding Coworker</title>
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2064%2064%27%3E%3Ccircle%20cx=%2732%27%20cy=%2732%27%20r=%2730%27%20fill=%27%23008080%27/%3E%3Ccircle%20cx=%2730%27%20cy=%2721%27%20r=%278%27%20fill=%27white%27/%3E%3Cpath%20d=%27M13%2048a17%2017%200%200%201%2034%200z%27%20fill=%27white%27/%3E%3Ccircle%20cx=%2750%27%20cy=%2744%27%20r=%2710%27%20fill=%27white%27/%3E%3Cpath%20d=%27M50%2038v12M44%2044h12%27%20stroke=%27%23008080%27%20stroke-width=%274%27/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>Onboarding Coworker</strong>
      <small class="byline">By INSPYR Velocity - All rights reserved</small>
      <span>INSPYR · synthetic data only · local demo</span>
    </div>
    <label class="role">Viewing as
      <select id="role">
        <option value="recruiter">Recruiter</option>
        <option value="onboarding">Onboarding Team</option>
        <option value="approver">Approver (Consultant Onboarding Supervisor)</option>
        <option value="it">IT</option>
        <option value="ldc">LDC (Culture and Belonging)</option>
      </select>
    </label>
  </header>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="inbox">Simulated inbox</button>
    <button role="tab" data-view="dashboard">Dashboard</button>
    <button role="tab" data-view="approval">Approval</button>
    <button role="tab" data-view="alerts">Simulated alerts</button>
    <button role="tab" data-view="status">Status</button>
    <button role="tab" data-view="knowledge">Knowledge</button>
  </nav>
  <main id="view" aria-live="polite"></main>
  <script type="module" src="shared/app.js"></script>
</body>
</html>
