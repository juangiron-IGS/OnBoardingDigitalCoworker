[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-digital-coworker"
version = "0.1.0"
description = "Onboarding Digital Coworker for INSPYR on Velocity 2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "psycopg[binary,pool]",
    "mcp>=2.3,<3",
    "pyyaml",
    "httpx",
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
tray = [
    "pystray>=0.19,<1",
    "Pillow>=11,<13",
    "pywebview>=5,<7",
    "windows-toasts>=1.3,<2; sys_platform == 'win32'",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = [
    "contracts*",
    "services*",
    "web*",
    "agents*",
    "mcp_servers*",
    "desktop*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs the local PostgreSQL (./scripts/start.sh)"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle errors and warnings (PEP 8)
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "ANN",      # type annotations
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade
    "S",        # bandit-derived security rules
]
# N818: governance refusals (ApprovalRefused, InvalidTransition) are expected,
# audited outcomes named in the Tech Doc and Code Standards, not "...Error" types.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
